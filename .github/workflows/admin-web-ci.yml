name: Admin Web CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'admin-web/**'

jobs:
  build:
    name: Build & Validate Admin Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'admin-web/package.json'

      - name: Install Dependencies
        working-directory: ./admin-web
        run: npm ci

      - name: Run Build
        working-directory: ./admin-web
        run: npm run build
