name: Mobile App CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'

jobs:
  validate:
    name: Mobile Type Check & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package.json'

      - name: Install Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Run Type Check
        working-directory: ./mobile
        run: npx tsc --noEmit

  eas-build:
    name: EAS Build Preview / Production
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Run EAS Build
        working-directory: ./mobile
        run: eas build --platform all --non-interactive --auto-submit
